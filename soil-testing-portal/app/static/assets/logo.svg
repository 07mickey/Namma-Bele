<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Glass Badge Gradient -->
    <linearGradient id="badgeGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#eaf3ec" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Leaf Vibrant Green Gradient -->
    <linearGradient id="leafGrad" x1="32" y1="12" x2="48" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ea45e" />
      <stop offset="100%" stop-color="#1e7e48" />
    </linearGradient>

    <!-- Left Leaf Dark Forest Green Gradient -->
    <linearGradient id="leafDarkGrad" x1="16" y1="18" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24874d" />
      <stop offset="100%" stop-color="#155d34" />
    </linearGradient>

    <!-- Fertile Topsoil Brown Gradient -->
    <linearGradient id="soilTopGrad" x1="14" y1="38" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8d5b32" />
      <stop offset="100%" stop-color="#6e4726" />
    </linearGradient>

    <!-- Deep Loam Soil Gradient -->
    <linearGradient id="soilDeepGrad" x1="16" y1="44" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6e4726" />
      <stop offset="100%" stop-color="#54361c" />
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="badgeShadow" x="0" y="2" width="64" height="62" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14281b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Badge with Glass Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2" filter="url(#badgeShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="rgba(30, 126, 72, 0.18)" stroke-width="1" />

  <!-- Soil Layers (Earth Brown Strata) -->
  <!-- Base Soil Horizon -->
  <path d="M12 45 C18 42, 46 43, 52 46 C50 51, 44 54, 32 54 C20 54, 14 50, 12 45 Z" fill="url(#soilDeepGrad)" />
  
  <!-- Top Soil Layer with Wave (Humus / Sowing Bed) -->
  <path d="M11 39 C19 36, 27 41, 35 38 C43 35, 49 39, 53 41 C52 45, 47 47, 32 47 C17 47, 12 44, 11 39 Z" fill="url(#soilTopGrad)" />

  <!-- Soil Core Nutrients Texture Dots -->
  <circle cx="24" cy="48" r="1.5" fill="#a47148" opacity="0.8" />
  <circle cx="34" cy="50" r="1.3" fill="#a47148" opacity="0.7" />
  <circle cx="43" cy="47" r="1.2" fill="#a47148" opacity="0.8" />
  <circle cx="28" cy="43" r="1.2" fill="#d4a373" opacity="0.9" />
  <circle cx="39" cy="42" r="1.1" fill="#d4a373" opacity="0.9" />

  <!-- Plant Stem Rising from Soil -->
  <path d="M32 42 C32 32, 33 24, 32 16" stroke="#155d34" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Sprout Leaf -->
  <path d="M32 28 C22 28, 17 21, 19 16 C26 15, 30 21, 32 28 Z" fill="url(#leafDarkGrad)" />
  <path d="M21 19 C25 21, 29 24, 32 28" stroke="#38b06c" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />

  <!-- Right Sprout Leaf (Vibrant Vitality) -->
  <path d="M32 23 C43 23, 47 15, 45 11 C38 10, 33 16, 32 23 Z" fill="url(#leafGrad)" />
  <path d="M43 13 C39 16, 35 19, 32 23" stroke="#e8f5e9" stroke-width="1" stroke-linecap="round" opacity="0.85" />

  <!-- Scientific Lab Test Droplet Accent (Top Right) -->
  <circle cx="43" cy="18" r="2.2" fill="#ffffff" opacity="0.9" />
</svg>


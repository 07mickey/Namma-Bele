<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Sign In — NAMMA BELE</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    .admin-auth-container {
      max-width: 460px;
      margin: 2.5rem auto 3.5rem;
    }
    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(110, 71, 38, 0.12);
      border: 1px solid var(--color-soil-border);
      color: var(--color-earth-brown);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.35rem 0.95rem;
      border-radius: var(--radius-pill);
      margin-bottom: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Top Glass Navigation -->
  <nav class="glass-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <span class="nav-brand-badge">
          <img src="{{ url_for('static', filename='assets/logo.svg') }}" alt="NAMMA BELE Logo" width="42" height="42">
        </span>
        <div class="nav-brand-text">
          <span class="nav-brand-title">NAMMA BELE</span>
          <span class="nav-brand-subtitle">Administrator Access</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link">Farmer Portal</a></li>
        <li><a href="/admin-login" class="nav-link active">Admin Sign In</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <main class="page-wrapper">
    <div class="admin-auth-container">
      
      <div class="glass-card glass-card-earth">
        <div style="text-align: center; margin-bottom: 1.75rem;">
          <div class="admin-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Portal Administrator
          </div>
          <h1 class="page-title" style="justify-content: center; font-size: 1.75rem;">
            Admin Portal
          </h1>
          <p class="page-subtitle" style="margin-left: auto; margin-right: auto; text-align: center;">
            Coordinator &amp; Lab Management Console
          </p>
        </div>

        <!-- Notification Banner -->
        <div id="admin-alert" class="glass-alert" style="display: none;"></div>

        <!-- Auto-Fill Quick Admin Credentials Card -->
        <div class="demo-credentials-box" style="margin-bottom: 1.35rem; padding: 0.75rem 1rem; background: rgba(251, 245, 239, 0.9); border: 1px dashed rgba(110, 71, 38, 0.35); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; font-size: 0.85rem;">
          <div>
            <span style="font-weight: 800; color: var(--color-earth-brown);">⚡ Demo Credentials:</span>
            <span style="color: var(--color-text-muted); margin-left: 4px;"><code>+919999000008</code> &bull; <code>DemoUser@2026!</code></span>
          </div>
          <div style="display: flex; gap: 0.4rem;">
            <button type="button" id="autofill-admin-btn" class="btn btn-secondary" style="min-height: 32px; padding: 0.25rem 0.75rem; font-size: 0.78rem;">
              Fill Fields
            </button>
            <button type="button" onclick="loginAdminDemoMode()" class="btn btn-primary" style="min-height: 32px; padding: 0.25rem 0.85rem; font-size: 0.78rem;">
              Sign In Now &rarr;
            </button>
          </div>
        </div>

        <form id="admin-login-form" novalidate>
          
          <div class="form-group">
            <label for="username" class="form-label">Admin Username / Identifier <span class="required">*</span></label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-control" 
              value="admin"
              placeholder="e.g. admin or coordinator" 
              required
              autocomplete="username"
            >
            <div id="username-error" class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password <span class="required">*</span></label>
            <div class="password-toggle-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                placeholder="Enter administrator password" 
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle-btn" id="toggle-admin-pass-btn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="7" r="3"></circle>
                </svg>
              </button>
            </div>
            <div id="password-error" class="form-error"></div>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem; font-size: 1.02rem;">
            Sign In to Admin Console
          </button>

        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--color-text-muted);">
          Are you a farmer? <a href="login.html" style="color: var(--color-primary-green); font-weight: 700; text-decoration: none;">Go to Farmer Login &rarr;</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Glass Footer -->
  <footer class="glass-footer">
    <p>NAMMA BELE &bull; Soil Testing &amp; Agricultural Administration Console</p>
  </footer>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/validation.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  <script>
    // Redirect if already logged in as admin
    Admin.redirectIfAdminLoggedIn();

    const form = document.getElementById('admin-login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const alertBanner = document.getElementById('admin-alert');
    const submitBtn = document.getElementById('submit-btn');
    const autofillAdminBtn = document.getElementById('autofill-admin-btn');

    function fillAdminCredentials() {
      usernameInput.value = '+919999000008';
      passwordInput.value = 'DemoUser@2026!';
      document.getElementById('username-error').classList.remove('visible');
      document.getElementById('password-error').classList.remove('visible');
      usernameInput.classList.remove('is-invalid');
      passwordInput.classList.remove('is-invalid');
    }

    // Automatically fill credentials on page load
    fillAdminCredentials();

    window.loginAdminDemoMode = function() {
      Admin.saveAdminSession('demo-admin-token', {
        username: (usernameInput && usernameInput.value.trim()) || '+919999000008',
        role: 'Chief Agricultural Coordinator'
      });
      window.location.href = '/admin';
    };

    if (autofillAdminBtn) {
      autofillAdminBtn.addEventListener('click', fillAdminCredentials);
    }

    const toggleAdminPass = document.getElementById('toggle-admin-pass-btn');
    if (toggleAdminPass) {
      toggleAdminPass.addEventListener('click', () => {
        const isPwd = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
        toggleAdminPass.innerHTML = isPwd
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    }

    // Check query params
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('logged_out') === '1') {
      alertBanner.className = 'glass-alert glass-alert-success';
      alertBanner.innerHTML = 'Admin session signed out successfully.';
      alertBanner.style.display = 'flex';
    } else if (urlParams.get('session_expired') === '1') {
      alertBanner.className = 'glass-alert glass-alert-offline';
      alertBanner.innerHTML = 'Admin session expired. Please log in again.';
      alertBanner.style.display = 'flex';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      let hasError = false;

      if (!usernameInput.value.trim()) {
        document.getElementById('username-error').textContent = 'Username is required.';
        document.getElementById('username-error').classList.add('visible');
        usernameInput.classList.add('is-invalid');
        hasError = true;
      } else {
        document.getElementById('username-error').classList.remove('visible');
        usernameInput.classList.remove('is-invalid');
      }

      if (!passwordInput.value.trim()) {
        document.getElementById('password-error').textContent = 'Password is required.';
        document.getElementById('password-error').classList.add('visible');
        passwordInput.classList.add('is-invalid');
        hasError = true;
      } else {
        document.getElementById('password-error').classList.remove('visible');
        passwordInput.classList.remove('is-invalid');
      }

      if (hasError) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Authenticating...';

      const res = await Admin.adminLogin({
        username: usernameInput.value.trim(),
        password: passwordInput.value
      });

      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Sign In to Admin Console';

      if (res.ok && res.data?.token) {
        Admin.saveAdminSession(res.data.token, res.data.admin || { username: usernameInput.value.trim(), role: 'Coordinator' });
        window.location.href = '/admin';
      } else if (res.offline) {
        alertBanner.className = 'glass-alert glass-alert-offline';
        alertBanner.innerHTML = `
          <div>
            <strong>Backend Offline:</strong> Person 1's Flask server is not running on http://127.0.0.1:5000.<br>
            <span style="font-size: 0.86rem; color: var(--color-text-muted); display: block; margin: 0.4rem 0;">
              You can explore the complete Admin Console right now in <strong>Interactive Preview Mode</strong> with sample data.
            </span>
            <button type="button" onclick="loginAdminDemoMode()" class="btn btn-primary" style="min-height: 34px; padding: 0.35rem 0.95rem; font-size: 0.84rem; margin-top: 0.3rem;">
              ⚡ Continue to Admin Console in Preview Mode &rarr;
            </button>
          </div>
        `;
        alertBanner.style.display = 'flex';
      } else {
        alertBanner.className = 'glass-alert glass-alert-error';
        alertBanner.innerHTML = `<strong>Authentication Failed:</strong> ${Validation.escapeHtml(res.error || 'Invalid administrator credentials.')}`;
        alertBanner.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
